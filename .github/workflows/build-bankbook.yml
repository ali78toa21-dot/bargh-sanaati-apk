name: Build BankBook APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "bankbook/**"
      - ".github/workflows/build-bankbook.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build BankBook debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build BankBook APK
        run: gradle --no-daemon -p bankbook assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bankbook-apk
          path: bankbook/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
